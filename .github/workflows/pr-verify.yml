name: PR Verification

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code style (ruff)
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check out TypeScript SDK for shared fixtures
        uses: actions/checkout@v4
        with:
          repository: creatorpiyush/raglite
          path: .ts-sdk

      - name: Check shared fixtures match the TypeScript SDK
        run: python scripts/sync_shared_fixtures.py --check --source .ts-sdk
